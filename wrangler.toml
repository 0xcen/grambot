name = "grambot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[observability]
enabled = true

# How long a chat must be quiet before its buffered messages go to the routine
# as one batch. Milliseconds, capped at 60000.
[vars]
DEBOUNCE_MS = "2000"

[[durable_objects.bindings]]
name = "CHAT_BUFFER"
class_name = "ChatBuffer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatBuffer"]

# Secrets (set with `wrangler secret put`, see README.md):
# BOT_TOKEN, TG_WEBHOOK_SECRET, MCP_BEARER_TOKEN, ALLOWED_USER_IDS,
# GROKBOT_WEBHOOK_URL, GROKBOT_WEBHOOK_AUTH, GROKBOT_WEBHOOK_AUTH_HEADER (optional)
