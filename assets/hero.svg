<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">grokbot-telegram</title>
  <desc id="desc">Your own Telegram client for your Grok Bot. A Telegram message passes through a tiny Cloudflare Worker to a Grok Bot routine, which replies in the same chat.</desc>
  <defs>
    <symbol id="plane" viewBox="0 0 24 24">
      <path d="M21.2 3.6 2.9 10.7c-.9.4-.9 1.6.1 1.9l4.6 1.5 1.8 5.6c.3.8 1.3 1 1.9.4l2.6-2.5 4.8 3.5c.7.5 1.6.1 1.8-.7l3.1-14.7c.2-.9-.7-1.6-1.5-1.2Zm-3.5 4.2-8 7.3-.4 3.1-1.2-4 9.2-6.8c.3-.2.6.2.4.4Z" fill="currentColor"/>
    </symbol>
    <symbol id="spark" viewBox="0 0 24 24">
      <path d="M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="shield" viewBox="0 0 24 24">
      <path d="M12 3 5 5.8v5.6c0 4.3 2.9 8 7 9.6 4.1-1.6 7-5.3 7-9.6V5.8L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
      <path d="m9 12 2.1 2.1L15.2 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 24 24">
      <path d="M7.2 18.5h10.3a4 4 0 0 0 .5-8 6 6 0 0 0-11.4 1.4 3.3 3.3 0 0 0 .6 6.6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
    </symbol>
    <symbol id="bubble" viewBox="0 0 24 24">
      <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4.6 3.6c-.4.3-.9 0-.9-.4V16A2.5 2.5 0 0 1 4 13.5v-7Z" fill="currentColor"/>
    </symbol>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1280" height="640" fill="#0F100F"/>

  <!-- Left column -->
  <g transform="translate(68 58)">
    <rect width="40" height="40" rx="9" fill="#262825"/>
    <use href="#plane" x="9" y="9" width="22" height="22" color="#F4F3EC"/>
    <text x="54" y="29" font-size="30" font-weight="500" letter-spacing="-0.9" fill="#F4F3EC">grokbot-telegram</text>
  </g>

  <g font-size="70" font-weight="500" letter-spacing="-2.8" fill="#F4F3EC">
    <text x="64" y="212">Your own</text>
    <text x="64" y="290">Telegram client</text>
    <text x="64" y="368">for your Grok Bot.</text>
  </g>

  <g font-size="24" letter-spacing="-0.5" fill="#8E9089">
    <text x="68" y="428">Text your bot from your phone.</text>
    <text x="68" y="460">A tiny Worker passes it on. It replies in chat.</text>
  </g>

  <!-- Right column: Telegram panel -->
  <g transform="translate(700 64)">
    <rect x="0.5" y="0.5" width="511" height="171" rx="12" fill="#1A1B19" stroke="#2C2E2A"/>
    <path d="M12.5 .5h487a12 12 0 0 1 12 12V40H.5V12.5a12 12 0 0 1 12-12Z" fill="#1E201D"/>
    <line x1="0.5" y1="40.5" x2="511.5" y2="40.5" stroke="#2C2E2A"/>
    <circle cx="22" cy="20.5" r="5" fill="#F4F3EC"/>
    <text x="36" y="26" font-size="17" font-weight="500" fill="#F4F3EC">Telegram</text>
    <text x="492" y="26" font-size="15" fill="#8E9089" text-anchor="end">@your_grokbot</text>

    <rect x="200" y="58" width="292" height="40" rx="14" fill="#F4F3EC"/>
    <text x="218" y="84" font-size="17" fill="#161716">What's on my calendar today?</text>

    <rect x="20" y="110" width="344" height="40" rx="14" fill="#262825"/>
    <text x="38" y="136" font-size="17" fill="#F4F3EC">Two meetings. Standup 10, review 3.</text>
  </g>

  <!-- Worker panel -->
  <g transform="translate(700 252)">
    <rect x="0.5" y="0.5" width="511" height="111" rx="12" fill="#1A1B19" stroke="#2C2E2A"/>
    <path d="M12.5 .5h487a12 12 0 0 1 12 12V40H.5V12.5a12 12 0 0 1 12-12Z" fill="#1E201D"/>
    <line x1="0.5" y1="40.5" x2="511.5" y2="40.5" stroke="#2C2E2A"/>
    <circle cx="22" cy="20.5" r="5" fill="#B6BB98"/>
    <text x="36" y="26" font-size="17" font-weight="500" fill="#F4F3EC">Cloudflare Worker</text>
    <text x="492" y="26" font-size="15" fill="#8E9089" text-anchor="end">workers.dev</text>

    <rect x="20" y="56" width="40" height="40" rx="9" fill="#262825"/>
    <use href="#cloud" x="29" y="65" width="22" height="22" color="#F4F3EC"/>
    <line x1="76.5" y1="60" x2="76.5" y2="92" stroke="#2C2E2A"/>
    <g font-size="15" fill="#F4F3EC">
      <rect x="92" y="62" width="128" height="28" rx="14" fill="#262825"/>
      <use href="#shield" x="102" y="68" width="16" height="16" color="#B6BB98"/>
      <text x="124" y="81">Secret check</text>
      <rect x="230" y="62" width="104" height="28" rx="14" fill="#262825"/>
      <use href="#shield" x="240" y="68" width="16" height="16" color="#B6BB98"/>
      <text x="262" y="81">Allowlist</text>
      <rect x="344" y="62" width="148" height="28" rx="14" fill="#262825"/>
      <use href="#shield" x="354" y="68" width="16" height="16" color="#B6BB98"/>
      <text x="376" y="81">Send-only MCP</text>
    </g>
  </g>

  <!-- Grok Bot panel -->
  <g transform="translate(700 384)">
    <rect x="0.5" y="0.5" width="511" height="111" rx="12" fill="#1A1B19" stroke="#2C2E2A"/>
    <path d="M12.5 .5h487a12 12 0 0 1 12 12V40H.5V12.5a12 12 0 0 1 12-12Z" fill="#1E201D"/>
    <line x1="0.5" y1="40.5" x2="511.5" y2="40.5" stroke="#2C2E2A"/>
    <circle cx="22" cy="20.5" r="5" fill="#767973"/>
    <text x="36" y="26" font-size="17" font-weight="500" fill="#F4F3EC">Grok Bot</text>
    <text x="492" y="26" font-size="15" fill="#8E9089" text-anchor="end">routine</text>

    <rect x="20" y="56" width="40" height="40" rx="9" fill="#F4F3EC"/>
    <use href="#spark" x="29" y="65" width="22" height="22" color="#161716"/>
    <line x1="76.5" y1="60" x2="76.5" y2="92" stroke="#2C2E2A"/>
    <text x="92" y="82" font-size="16" fill="#F4F3EC" class="mono">send_telegram_message</text>
    <path d="M318 76h22m-6-6 6 6-6 6" stroke="#8E9089" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="356" y="56" width="40" height="40" rx="20" fill="#262825"/>
    <use href="#bubble" x="365" y="65" width="22" height="22" color="#F4F3EC"/>
    <text x="408" y="82" font-size="17" fill="#F4F3EC">Same chat</text>
  </g>

  <!-- Footer facts -->
  <line x1="48" y1="556.5" x2="1232" y2="556.5" stroke="#2C2E2A"/>
  <g font-size="17" fill="#8E9089" text-anchor="middle">
    <text x="245" y="604">Free &amp; open source</text>
    <text x="640" y="604">Runs on Cloudflare Workers</text>
    <text x="1035" y="604">Set up by your bot</text>
  </g>
  <line x1="442.5" y1="586" x2="442.5" y2="608" stroke="#2C2E2A"/>
  <line x1="837.5" y1="586" x2="837.5" y2="608" stroke="#2C2E2A"/>
</svg>
